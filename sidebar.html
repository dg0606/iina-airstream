<!doctype html>
<meta charset="utf-8">
<title>AirStream</title>
<style>
  :root { --ink:#1C1C1E; --ink2:rgba(0,0,0,.55); --btn:rgba(0,0,0,.07); --accent:#007AFF; }
  @media (prefers-color-scheme: dark) { :root { --ink:#F2F3F5; --ink2:rgba(255,255,255,.58); --btn:rgba(255,255,255,.1); --accent:#0A84FF; } }
  html,body { margin:0; background:transparent; color:var(--ink); font:13px/1.45 -apple-system,sans-serif; }
  #w { padding:14px; }
  h1 { font-size:15px; margin:0 0 4px; }
  #title { color:var(--ink2); margin:0 0 12px; word-break:break-word; }
  button { font:inherit; color:var(--ink); background:var(--btn); border:0; border-radius:8px; padding:10px 12px; cursor:pointer; width:100%; text-align:left; margin-bottom:6px; }
  button.go { background:var(--accent); color:#fff; }
  button:disabled { opacity:.45; cursor:default; }
  #msg { margin-top:10px; color:var(--ink2); min-height:1.4em; }
  video { position:absolute; width:1px; height:1px; opacity:.01; }
</style>
<video id="v" playsinline preload="metadata" x-webkit-airplay="allow"></video>
<div id="w">
  <h1>AirStream</h1>
  <div id="title"></div>
  <button id="air" class="go" disabled>AirPlay — choose TV</button>
  <button id="reload">Reload stream</button>
  <div id="msg">Waiting for the plugin…</div>
  <div id="hint" style="color:var(--ink2);margin-top:8px"></div>
</div>
<script>
  const $ = (id) => document.getElementById(id), v = $("v");
  let loaded = "", avail = false, onTV = false, st = null, err = "";

  function ui() {
    const ready = st && st.status !== "resolving" && st.url && loaded === st.url;
    $("air").disabled = !ready || !v.webkitShowPlaybackTargetPicker;
    $("air").textContent = onTV ? "AirPlay — change / stop (pick this Mac)" : "AirPlay — choose TV";
    $("title").textContent = st ? st.title : "";
    let m = err || (st ? st.msg : "");
    if (st && ready && !avail && !onTV) m += " (no AirPlay devices detected yet)";
    $("msg").textContent = m;
    $("hint").textContent = onTV ? "Playing on TV: " + fmt(v.currentTime) + ". Pause/seek from the TV remote." : "";
  }
  const fmt = (t) => Math.floor(t / 60) + ":" + ("0" + Math.floor(t % 60)).slice(-2);

  iina.onMessage("state", (s) => {
    st = s;
    if (s.url && s.url !== loaded) {
      loaded = s.url; err = "";
      const p = s.pos || 0;
      v.src = s.url; v.load();
      v.addEventListener("loadedmetadata", () => { if (p > 1) { try { v.currentTime = p; } catch (e) {} } }, { once: true });
    }
    ui();
  });
  $("air").onclick = () => v.webkitShowPlaybackTargetPicker && v.webkitShowPlaybackTargetPicker();
  $("reload").onclick = () => { loaded = ""; err = ""; iina.postMessage("reload", {}); };
  v.addEventListener("webkitplaybacktargetavailabilitychanged", (e) => { avail = e.availability === "available"; ui(); });
  v.addEventListener("webkitcurrentplaybacktargetiswirelesschanged", () => {
    onTV = !!v.webkitCurrentPlaybackTargetIsWireless;
    if (onTV) { v.muted = false; v.play().catch(() => {}); } else { v.pause(); }
    iina.postMessage("tv", { onTV, t: v.currentTime });
    ui();
  });
  v.addEventListener("error", () => {
    err = "The stream could not be loaded (media error " + (v.error ? v.error.code : "?") + "). Try Reload.";
    ui();
  });
  setInterval(() => { if (onTV) iina.postMessage("tv", { onTV: true, t: v.currentTime }); iina.postMessage("getState", {}); }, 1000);
  iina.postMessage("getState", {});
</script>
